<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家計簿クイック入力</title>
<meta name="theme-color" content="#1B2030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --navy: #1B2030;
    --blue: #3457D5;
    --blue-soft: #E8ECFC;
    --gray-soft: #ECEDF4;
    --border: #DFE2EA;
    --white: #FFFFFF;
    --muted: #8A90A3;
    --good: #21935E;
    --good-soft: #E3F5EC;
    --warn: #A4700A;
    --warn-soft: #FBF0DC;
    --bad: #C43D34;
    --bad-soft: #FBE7E5;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", "Meiryo", "Segoe UI", sans-serif;
    color: var(--navy);
    background: var(--gray-soft);
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 14px 16px;
    padding-top: calc(14px + env(safe-area-inset-top));
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; }
  main { padding: 14px; max-width: 480px; margin: 0 auto; padding-bottom: 60px; }
  .card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h2 { font-size: 13px; margin: 0 0 10px 0; font-weight: 700; color: var(--muted); }
  .kpi-row { display: flex; gap: 8px; }
  .kpi { flex: 1; text-align: center; }
  .kpi .label { font-size: 11px; color: var(--muted); }
  .kpi .value { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .kpi .value.bad { color: var(--bad); }
  .kpi .value.good { color: var(--good); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  select, input[type=text], input[type=number], input[type=date] {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 16px; /* 16px未満だとiPhoneで入力時に画面が拡大されるため */
    font-family: inherit;
    background: #fff;
    color: var(--navy);
  }
  .row2 { display: flex; gap: 8px; }
  .row2 > div { flex: 1; }
  button.btn {
    width: 100%;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 13px 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button.btn:disabled { opacity: 0.5; }
  button.btn.ghost {
    background: var(--gray-soft);
    color: var(--navy);
    margin-top: 8px;
  }
  .msg { font-size: 13px; margin-top: 10px; padding: 8px 10px; border-radius: 6px; display: none; }
  .msg.ok { display: block; background: var(--good-soft); color: var(--good); }
  .msg.err { display: block; background: var(--bad-soft); color: var(--bad); }
  .edit-banner {
    background: var(--blue-soft);
    color: var(--blue);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .edit-banner button {
    background: none;
    border: none;
    color: var(--blue);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
    font-weight: 700;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table th, table td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  table th { color: var(--muted); font-weight: 700; font-size: 11px; }
  .bar-outer { background: var(--gray-soft); border-radius: 4px; height: 6px; overflow: hidden; margin-top: 4px; }
  .bar-inner { height: 100%; background: var(--good); }
  .bar-inner.warn { background: var(--warn); }
  .bar-inner.bad { background: var(--bad); }
  .cat-row { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .cat-row:last-child { border-bottom: none; }
  .cat-row .top { display: flex; justify-content: space-between; font-size: 13px; }
  .cat-row .top .name { font-weight: 700; }
  .cat-row .top .amt { color: var(--muted); }
  .loading { text-align: center; color: var(--muted); padding: 30px 0; font-size: 13px; }
  .recent-row td { font-size: 12px; }
  /* スマホの狭い画面で日付・支払者などの短い項目が1文字ずつ縦に折り返さないようにする。
     メモとカテゴリだけは折り返してよい。それでも入りきらない場合は表を横スクロール */
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .table-scroll th, .recent-row td { white-space: nowrap; }
  .recent-row td.wrap { white-space: normal; min-width: 5em; }
  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 14px;
    padding: 2px 5px;
    color: var(--muted);
  }
  .icon-btn.danger:active { color: var(--bad); }
  .icon-btn.edit:active { color: var(--blue); }
  .op-cell { white-space: nowrap; }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .card-head h2 { margin: 0; }
  #refreshBtn, #dashRefreshBtn {
    font-size: 12px;
    font-weight: 700;
    color: var(--blue);
    background: var(--blue-soft);
    border: none;
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  #refreshBtn:disabled, #dashRefreshBtn:disabled { opacity: 0.5; }
  .login-box { text-align: center; padding: 24px 8px; }
  .login-box p { font-size: 13px; color: var(--muted); line-height: 1.7; margin: 0 0 18px; }
  .footer-link { text-align: center; margin-top: 8px; }
  .footer-link button { background: none; border: none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; }
  /* 入力/ダッシュボードの切り替え */
  .tabs { display: flex; background: var(--white); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .tabs[hidden] { display: none; }
  .tabs button {
    flex: 1; background: none; border: none; padding: 12px 0; font-size: 14px; font-weight: 700;
    color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; font-family: inherit;
  }
  .tabs button.active { color: var(--blue); border-bottom-color: var(--blue); }
  /* ダッシュボード(PCの資産管理アプリのダッシュボードを見るだけ) */
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi-tile { background: var(--blue-soft); border-radius: 8px; padding: 10px; }
  .kpi-tile .label { font-size: 11px; color: var(--muted); }
  .kpi-tile .value { font-size: 17px; font-weight: 700; margin-top: 2px; }
  .kpi-tile .value.good { color: var(--good); }
  .kpi-tile .value.bad { color: var(--bad); }
  .saved-at { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .dash-row { padding: 8px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .dash-row.child { padding-left: 14px; }
  .dash-row.child .name { font-weight: 400; }
  .dash-row .top { display: flex; justify-content: space-between; font-size: 13px; gap: 8px; }
  .dash-row .top .name { font-weight: 700; }
  .dash-row .top .amt { color: var(--muted); white-space: nowrap; }
  .dash-row .sub { font-size: 11px; color: var(--muted); margin-top: 3px; text-align: right; }
  .dash-row .caret { color: var(--muted); font-size: 10px; margin-left: 4px; }
  .bar-inner.none { background: var(--muted); }
  .dash-detail { padding: 4px 0 8px 14px; }
  .dash-detail table td { font-size: 12px; vertical-align: top; }
  .dash-detail .memo { color: var(--muted); font-size: 11px; }
  .empty-note { font-size: 13px; color: var(--muted); padding: 6px 0; }
</style>
</head>
<body>
<header><h1>家計簿クイック入力</h1></header>
<nav class="tabs" id="tabs" hidden>
  <button type="button" data-view="input" class="active">入力</button>
  <button type="button" data-view="dash">ダッシュボード</button>
</nav>
<main id="app">
  <div class="loading" id="loading">読み込み中...</div>
</main>

<script>
/* ============================================================
   Googleログインとドライブの読み書き
   ------------------------------------------------------------
   家計データはGitHubには置かず、各自のGoogleドライブ上の
   「入力アプリ_ログ.json」「入力アプリ_config.json」を、ログインした
   本人の権限で直接読み書きする(ファイルはファイル名で探す)。
   ログインはリダイレクト方式(iPhoneのホーム画面から開いたアプリでは
   ポップアップ方式のログインが動かないことがあるため)。
   ============================================================ */
var CLIENT_ID = '567180524960-j5nsf5h2n29jqa0dqlblvbjqqqgalim3.apps.googleusercontent.com';
var SCOPE = 'https://www.googleapis.com/auth/drive';
var LOG_FILE_NAME = '入力アプリ_ログ.json';
var CONFIG_FILE_NAME = '入力アプリ_config.json';
var REDIRECT_URI = location.origin + location.pathname.replace(/index\.html$/, '');

var TOKEN_KEY = 'kakeiToken';
var STATE_KEY = 'kakeiAuthState';
var SIGNED_IN_KEY = 'kakeiSignedInBefore';
var FILE_IDS_KEY = 'kakeiFileIds';
// 前回ログインしたGoogleアカウントのメールアドレス。再ログイン時にlogin_hintとして渡し、
// 「アカウントを選択」画面でタップしなくても自動で同じアカウントが選ばれるようにする
var LOGIN_HINT_KEY = 'kakeiLoginHint';

function storageGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function storageSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* 保存できない環境では無視 */ }
}
function storageRemove(key) {
  try { localStorage.removeItem(key); } catch (e) { /* 同上 */ }
}

function startLogin() {
  var state = Math.random().toString(36).slice(2) + Date.now().toString(36);
  storageSet(STATE_KEY, state);
  var params = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: 'token',
    scope: SCOPE,
    include_granted_scopes: 'true',
    state: state
  });
  var hint = storageGet(LOGIN_HINT_KEY);
  if (hint) params.set('login_hint', hint);
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params.toString();
}

// Googleから戻ってきたときのURL(#access_token=...)からトークンを取り出して保存する
function takeTokenFromUrl() {
  if (!location.hash || location.hash.length < 2) return null;
  var p = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', REDIRECT_URI);
  if (p.get('error')) {
    return { error: p.get('error') };
  }
  var token = p.get('access_token');
  if (!token) return null;
  if (p.get('state') !== storageGet(STATE_KEY)) {
    return { error: 'state_mismatch' };
  }
  storageRemove(STATE_KEY);
  var expiresIn = Number(p.get('expires_in') || 3600);
  // 期限ぎりぎりで失敗しないよう、1分早めに期限切れ扱いにする
  storageSet(TOKEN_KEY, JSON.stringify({ token: token, expiresAt: Date.now() + (expiresIn - 60) * 1000 }));
  storageSet(SIGNED_IN_KEY, '1');
  return { ok: true };
}

function getValidToken() {
  var raw = storageGet(TOKEN_KEY);
  if (!raw) return null;
  try {
    var t = JSON.parse(raw);
    return t.expiresAt > Date.now() ? t.token : null;
  } catch (e) {
    return null;
  }
}

function logout() {
  storageRemove(TOKEN_KEY);
  storageRemove(SIGNED_IN_KEY);
  storageRemove(FILE_IDS_KEY);
  storageRemove(LOGIN_HINT_KEY);
  showLogin('ログアウトしました。');
}

function showLogin(message) {
  document.getElementById('tabs').hidden = true;
  document.getElementById('app').innerHTML =
    '<div class="card login-box">' +
      '<p>' + escapeHtml(message || '') + (message ? '<br>' : '') +
      'Googleドライブの家計データを読み書きするため、<br>Googleアカウントでログインしてください。</p>' +
      '<button type="button" class="btn" id="loginBtn">Googleでログイン</button>' +
    '</div>';
  document.getElementById('loginBtn').addEventListener('click', startLogin);
}

async function driveFetch(url, options) {
  var token = getValidToken();
  if (!token) {
    startLogin();
    throw new Error('ログインしています...');
  }
  options = options || {};
  options.headers = Object.assign({}, options.headers, { Authorization: 'Bearer ' + token });
  options.cache = 'no-store';
  var res = await fetch(url, options);
  if (res.status === 401) {
    storageRemove(TOKEN_KEY);
    startLogin();
    throw new Error('ログインの有効期限が切れたため、再ログインしています...');
  }
  return res;
}

// ログイン中のアカウントのメールアドレスを覚えておく(失敗しても動作には影響しない)
async function rememberLoginHint() {
  if (storageGet(LOGIN_HINT_KEY)) return;
  try {
    var res = await driveFetch('https://www.googleapis.com/drive/v3/about?fields=' + encodeURIComponent('user(emailAddress)'));
    if (!res.ok) return;
    var data = await res.json();
    if (data.user && data.user.emailAddress) storageSet(LOGIN_HINT_KEY, data.user.emailAddress);
  } catch (e) { /* 無視 */ }
}

function loadFileIds() {
  try { return JSON.parse(storageGet(FILE_IDS_KEY) || '{}'); } catch (e) { return {}; }
}

async function findFileId(name, forceSearch) {
  var ids = loadFileIds();
  if (ids[name] && !forceSearch) return ids[name];
  var q = "name = '" + name.replace(/'/g, "\\'") + "' and trashed = false";
  var url = 'https://www.googleapis.com/drive/v3/files?pageSize=10&orderBy=modifiedTime desc' +
    '&fields=' + encodeURIComponent('files(id,name,modifiedTime)') + '&q=' + encodeURIComponent(q);
  var res = await driveFetch(url);
  if (!res.ok) throw new Error('Googleドライブでファイルを探せませんでした(' + res.status + ')');
  var data = await res.json();
  if (!data.files || data.files.length === 0) {
    throw new Error('Googleドライブに「' + name + '」が見つかりません。このGoogleアカウントにファイルが共有されているか確認してください。');
  }
  // 同名ファイルが複数ある場合は最も新しく更新されたものを使う
  ids[name] = data.files[0].id;
  storageSet(FILE_IDS_KEY, JSON.stringify(ids));
  return ids[name];
}

async function readJson(name) {
  var id = await findFileId(name);
  var res = await driveFetch('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media');
  if (res.status === 404) {
    // 覚えていたファイルが削除・作り直しされた場合は探し直す
    id = await findFileId(name, true);
    res = await driveFetch('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media');
  }
  if (!res.ok) throw new Error('「' + name + '」を読み込めませんでした(' + res.status + ')');
  return res.json();
}

async function writeJson(name, obj) {
  var id = await findFileId(name);
  var res = await driveFetch('https://www.googleapis.com/upload/drive/v3/files/' + id + '?uploadType=media', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json; charset=UTF-8' },
    body: JSON.stringify(obj, null, 2)
  });
  if (!res.ok) {
    if (res.status === 403) {
      throw new Error('「' + name + '」を書き換える権限がありません。ファイルの共有設定が「編集者」になっているか確認してください。');
    }
    throw new Error('「' + name + '」に保存できませんでした(' + res.status + ')');
  }
}

/* ---------- データ操作(旧Apps Script版のCode.gsと同じ処理) ---------- */

function validateEntry(entry) {
  if (!entry || !entry.date || !entry.payer || !entry.category || !entry.paymentMethod) {
    throw new Error('必須項目が入力されていません');
  }
  var amount = Number(entry.amount);
  if (!isFinite(amount) || amount <= 0) {
    throw new Error('金額を正しく入力してください');
  }
  return amount;
}

async function getInitialData() {
  var results = await Promise.all([readJson(CONFIG_FILE_NAME), readJson(LOG_FILE_NAME)]);
  return { config: results[0], log: results[1] };
}

// 書き込みの直前に最新のログを読み直してから追加・更新する(2人がほぼ同時に
// 保存した場合に片方が消えるのを減らすため。Apps Script版のような排他ロックは無い)
async function submitEntry(entry) {
  var amount = validateEntry(entry);
  var log = await readJson(LOG_FILE_NAME);
  log.push({
    id: crypto.randomUUID(),
    date: entry.date,
    payer: entry.payer,
    category: entry.category,
    amount: amount,
    memo: entry.memo || '',
    paymentMethod: entry.paymentMethod,
    createdAt: new Date().toISOString()
  });
  await writeJson(LOG_FILE_NAME, log);
  return { config: STATE.config, log: log };
}

async function updateEntry(id, entry) {
  var amount = validateEntry(entry);
  var log = await readJson(LOG_FILE_NAME);
  var idx = log.findIndex(function(e) { return e.id === id; });
  if (idx === -1) throw new Error('対象の記録が見つかりません(既に削除された可能性があります)');
  log[idx] = {
    id: id,
    date: entry.date,
    payer: entry.payer,
    category: entry.category,
    amount: amount,
    memo: entry.memo || '',
    paymentMethod: entry.paymentMethod,
    createdAt: log[idx].createdAt,
    updatedAt: new Date().toISOString()
  };
  await writeJson(LOG_FILE_NAME, log);
  return { config: STATE.config, log: log };
}

async function deleteEntry(id) {
  var log = await readJson(LOG_FILE_NAME);
  var next = log.filter(function(e) { return e.id !== id; });
  if (next.length === log.length) throw new Error('対象の記録が見つかりません(既に削除された可能性があります)');
  await writeJson(LOG_FILE_NAME, next);
  return { config: STATE.config, log: next };
}

/* ============================================================
   画面(旧Apps Script版 v7 の Index.html と同じ内容)
   ============================================================ */
var STATE = { config: null, log: null };
var EDITING_ID = null;
// toISOString()はUTC基準で、日本時間の月初0〜9時に前月扱いになるため端末のローカル日付で求める
function localMonthKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
var SELECTED_MONTH = localMonthKey(new Date());

function fmtYen(n) {
  return (n < 0 ? '-' : '') + '¥' + Math.abs(Math.round(n)).toLocaleString('ja-JP');
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function ymd(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function addDays(d, n) {
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() + n);
  return x;
}

// 週予算(config.categories の weeklyBudget)。週は月曜〜日曜の7日間で、月をまたいでも
// 1週分の予算とする。週は「月曜日が属する月」の週として数え(例: 9/28〜10/4は9月第4週)。
// 繰越額(同じ月の前の週までの残り/超過の合計、月が変わるとリセット)は参考表示のみで、
// 使いすぎ防止のため今週の予算には加算しない
function weeklyStatus(c, log, today) {
  function spentBetween(start, end) {
    var s = ymd(start), e2 = ymd(end), sum = 0;
    log.forEach(function(e) {
      if (e.category === c.name && e.date && e.date >= s && e.date <= e2) sum += Number(e.amount);
    });
    return sum;
  }
  var monday = addDays(today, -((today.getDay() + 6) % 7));
  var sunday = addDays(monday, 6);
  var ownerMonth = monday.getMonth();
  var carryover = 0, weekNo = 1;
  for (var m = addDays(monday, -7); m.getMonth() === ownerMonth; m = addDays(m, -7)) {
    carryover += c.weeklyBudget - spentBetween(m, addDays(m, 6));
    weekNo++;
  }
  return {
    label: (ownerMonth + 1) + '月第' + weekNo + '週',
    range: (monday.getMonth() + 1) + '/' + monday.getDate() + '〜' + (sunday.getMonth() + 1) + '/' + sunday.getDate(),
    carryover: carryover,
    spent: spentBetween(monday, sunday)
  };
}

function monthUsageByCategory(log) {
  var map = {};
  log.forEach(function(e) {
    if (!e.date || e.date.slice(0, 7) !== SELECTED_MONTH) return;
    map[e.category] = (map[e.category] || 0) + Number(e.amount);
  });
  return map;
}

function optionHtml(value, selected, label) {
  return '<option value="' + escapeHtml(value) + '"' + (selected ? ' selected' : '') + '>' + escapeHtml(label == null ? value : label) + '</option>';
}

function render() {
  var config = STATE.config;
  var log = STATE.log;
  var usage = monthUsageByCategory(log);

  var totalBudget = 0, totalUsed = 0;
  config.categories.forEach(function(c) {
    totalBudget += c.budget;
    totalUsed += (usage[c.name] || 0);
  });
  var remaining = totalBudget - totalUsed;

  var editingEntry = EDITING_ID ? log.find(function(e) { return e.id === EDITING_ID; }) : null;
  if (EDITING_ID && !editingEntry) EDITING_ID = null;

  var savedPayer = storageGet('lastPayer') || config.payers[0];
  var savedMethod = storageGet('lastMethod') || config.paymentMethods[0];
  var today = new Date();
  var todayStr = ymd(today);

  var defaultDate = editingEntry ? editingEntry.date : todayStr;
  var defaultPayer = editingEntry ? editingEntry.payer : savedPayer;
  var defaultMethod = editingEntry ? editingEntry.paymentMethod : savedMethod;
  var defaultCategory = editingEntry ? editingEntry.category : null;
  var defaultAmount = editingEntry ? editingEntry.amount : '';
  var defaultMemo = editingEntry ? (editingEntry.memo || '') : '';

  var payerOptions = config.payers.map(function(p) { return optionHtml(p, p === defaultPayer); }).join('');
  var methodOptions = config.paymentMethods.map(function(m) { return optionHtml(m, m === defaultMethod); }).join('');

  // カテゴリ選択肢は「予算表示対象(config.categories)」ではなく「全カテゴリ(config.allCategories)」
  // を使う。予算が確定していないカテゴリでも現金払いが発生することがあり、その記録漏れを防ぐため。
  // 予算のKPI・カテゴリ別バーは引き続きconfig.categoriesだけを対象にする(下記catRows参照)。
  var selectableCategories = config.allCategories || config.categories;
  var byParent = {};
  selectableCategories.forEach(function(c) {
    if (!byParent[c.parent]) byParent[c.parent] = [];
    byParent[c.parent].push(c);
  });
  var categoryOptions = Object.keys(byParent).map(function(parent) {
    var opts = byParent[parent].map(function(c) { return optionHtml(c.name, c.name === defaultCategory); }).join('');
    return '<optgroup label="' + escapeHtml(parent) + '">' + opts + '</optgroup>';
  }).join('');
  // 編集対象のカテゴリが現在の選択肢に無い場合(config側で後から絞り込まれた等)、
  // 気づかず別カテゴリに変わってしまわないよう、その場限りの選択肢として先頭に足す
  var hasDefaultCategory = selectableCategories.some(function(c) { return c.name === defaultCategory; });
  if (defaultCategory && !hasDefaultCategory) {
    categoryOptions = optionHtml(defaultCategory, true, defaultCategory + '(現在の選択肢にありません)') + categoryOptions;
  }

  var isCurrentMonth = SELECTED_MONTH === localMonthKey(today);
  var budgetCats = config.categories.filter(function(c) { return c.budget > 0; });

  // 同じ親カテゴリに予算付きの項目が2つ以上ある場合(食費=スーパー+外食など)は、
  // その先頭に合計行を出す。個々の予算をはみ出しても、合計で収まっていれば
  // よしとする見方ができるようにするため
  var groupMembers = {};
  budgetCats.forEach(function(c) {
    if (!c.parent) return;
    (groupMembers[c.parent] = groupMembers[c.parent] || []).push(c);
  });
  var groupShown = {};
  function groupRowHtml(parent) {
    var members = groupMembers[parent];
    var gBudget = 0, gUsed = 0;
    members.forEach(function(m) { gBudget += m.budget; gUsed += (usage[m.name] || 0); });
    var gPct = Math.min(100, Math.round((gUsed / gBudget) * 100));
    var gBarClass = gPct >= 100 ? 'bad' : (gPct >= 80 ? 'warn' : '');
    var gRem = gBudget - gUsed;
    return '<div class="cat-row" style="background:var(--blue-soft); border-radius:8px; padding:10px;">' +
      '<div class="top"><span class="name">' + escapeHtml(parent) + ' 合計</span><span class="amt">' + fmtYen(gUsed) + ' / ' + fmtYen(gBudget) + '</span></div>' +
      '<div class="bar-outer"><div class="bar-inner ' + gBarClass + '" style="width:' + gPct + '%"></div></div>' +
      '<div style="font-size:11px; margin-top:4px; color:var(--muted);">' + escapeHtml(members.map(function(m) { return m.name; }).join('+')) +
      ' のこり <span style="font-weight:700; color:' + (gRem < 0 ? 'var(--bad)' : 'var(--good)') + ';">' + fmtYen(gRem) + '</span></div>' +
      '</div>';
  }

  var catRows = budgetCats.map(function(c) {
    var groupHtml = '';
    if (c.parent && groupMembers[c.parent].length >= 2 && !groupShown[c.parent]) {
      groupShown[c.parent] = true;
      groupHtml = groupRowHtml(c.parent);
    }
    var used = usage[c.name] || 0;
    var pct = Math.min(100, Math.round((used / c.budget) * 100));
    var barClass = pct >= 100 ? 'bad' : (pct >= 80 ? 'warn' : '');
    // 週予算を持つカテゴリは、今月表示中のときだけ行の下に今週分を添える。
    // 予算はあくまで週予算そのもの(繰越は加算せず括弧書きで参考表示)
    var weekHtml = '';
    if (c.weeklyBudget > 0 && isCurrentMonth) {
      var w = weeklyStatus(c, log, today);
      var wPct = Math.min(100, Math.round((w.spent / c.weeklyBudget) * 100));
      var wBarClass = wPct >= 100 ? 'bad' : (wPct >= 80 ? 'warn' : '');
      var wRem = c.weeklyBudget - w.spent;
      weekHtml = '<div style="margin:8px 0 0 12px; padding-left:10px; border-left:3px solid var(--blue-soft);">' +
        '<div class="top" style="font-size:12px;"><span style="color:var(--muted); font-weight:700;">今週 ' + w.label + '(' + w.range + ')</span><span class="amt">' + fmtYen(w.spent) + ' / ' + fmtYen(c.weeklyBudget) + '</span></div>' +
        '<div class="bar-outer"><div class="bar-inner ' + wBarClass + '" style="width:' + wPct + '%"></div></div>' +
        '<div style="font-size:11px; margin-top:4px; color:var(--muted);">のこり <span style="font-weight:700; color:' + (wRem < 0 ? 'var(--bad)' : 'var(--good)') + ';">' + fmtYen(wRem) + '</span>' +
        '(繰越 ' + (w.carryover > 0 ? '+' : '') + fmtYen(w.carryover) + ')</div>' +
      '</div>';
    }
    return groupHtml + '<div class="cat-row">' +
      '<div class="top"><span class="name">' + escapeHtml(c.name) + '</span><span class="amt">' + fmtYen(used) + ' / ' + fmtYen(c.budget) + '</span></div>' +
      '<div class="bar-outer"><div class="bar-inner ' + barClass + '" style="width:' + pct + '%"></div></div>' +
      weekHtml +
      '</div>';
  }).join('');

  // 予算表示対象(config.categories)に含まれないカテゴリでの今月の支出を別枠で表示する
  var budgetCategoryNames = {};
  config.categories.forEach(function(c) { budgetCategoryNames[c.name] = true; });
  var otherRows = Object.keys(usage).filter(function(name) {
    return !budgetCategoryNames[name] && usage[name] > 0;
  }).sort(function(a, b) { return usage[b] - usage[a]; }).map(function(name) {
    return '<div class="cat-row"><div class="top"><span class="name">' + escapeHtml(name) + '</span><span class="amt">' + fmtYen(usage[name]) + '</span></div></div>';
  }).join('');

  // 選択月に入力された内容を全件表示する(件数制限なし)。日付の新しい順、
  // 同じ日付の場合は入力(記録)した順が新しいものを上にする
  var monthEntries = log.filter(function(e) { return e.date && e.date.slice(0, 7) === SELECTED_MONTH; })
    .slice()
    .sort(function(a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (a.createdAt || '') < (b.createdAt || '') ? 1 : -1;
    });
  var recent = monthEntries.map(function(e) {
    return '<tr class="recent-row"><td>' + escapeHtml(e.date.slice(5).replace('-', '/')) + '</td><td>' + escapeHtml(e.payer) + '</td><td class="wrap">' + escapeHtml(e.category) + '</td><td>' + fmtYen(e.amount) + '</td><td>' + escapeHtml(e.paymentMethod) + '</td><td class="wrap">' + escapeHtml(e.memo || '') + '</td>' +
      '<td class="op-cell"><button type="button" class="icon-btn edit" data-edit="' + escapeHtml(e.id) + '">✎</button><button type="button" class="icon-btn danger" data-del="' + escapeHtml(e.id) + '">✕</button></td></tr>';
  }).join('');

  // 月選択セレクト: ログに存在する月 + 常に今月を候補にする
  var monthsSet = {};
  log.forEach(function(e) { if (e.date) monthsSet[e.date.slice(0, 7)] = true; });
  monthsSet[localMonthKey(today)] = true;
  var monthOptions = Object.keys(monthsSet).sort().reverse().map(function(m) { return optionHtml(m, m === SELECTED_MONTH); }).join('');

  document.getElementById('app').innerHTML =
    '<div class="card">' +
      '<div class="card-head"><h2>予算状況</h2>' +
        '<div style="display:flex; gap:6px; align-items:center;">' +
          '<select id="monthSelect" style="width:auto; padding:5px 8px; font-size:14px;">' + monthOptions + '</select>' +
          '<button type="button" id="refreshBtn">⟳ 更新</button>' +
        '</div>' +
      '</div>' +
      '<div class="kpi-row">' +
        '<div class="kpi"><div class="label">予算</div><div class="value">' + fmtYen(totalBudget) + '</div></div>' +
        '<div class="kpi"><div class="label">使用</div><div class="value">' + fmtYen(totalUsed) + '</div></div>' +
        '<div class="kpi"><div class="label">のこり</div><div class="value ' + (remaining < 0 ? 'bad' : 'good') + '">' + fmtYen(remaining) + '</div></div>' +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<h2>' + (editingEntry ? '記録の編集' : '入力') + '</h2>' +
      (editingEntry ? '<div class="edit-banner"><span>この記録を編集中です</span><button type="button" id="cancelEditBtn">キャンセル</button></div>' : '') +
      '<form id="entryForm">' +
        '<div class="row2">' +
          '<div class="field"><label>日付</label><input type="date" id="f_date" value="' + escapeHtml(defaultDate) + '"></div>' +
          '<div class="field"><label>支払者</label><select id="f_payer">' + payerOptions + '</select></div>' +
        '</div>' +
        '<div class="field"><label>カテゴリ</label><select id="f_category">' + categoryOptions + '</select></div>' +
        '<div class="row2">' +
          '<div class="field"><label>金額</label><input type="number" id="f_amount" inputmode="numeric" placeholder="0" value="' + escapeHtml(defaultAmount) + '"></div>' +
          '<div class="field"><label>支払い方法</label><select id="f_method">' + methodOptions + '</select></div>' +
        '</div>' +
        '<div class="field"><label>メモ(任意)</label><input type="text" id="f_memo" placeholder="" value="' + escapeHtml(defaultMemo) + '"></div>' +
        '<button type="submit" class="btn" id="submitBtn">' + (editingEntry ? '更新' : '確定') + '</button>' +
        (editingEntry ? '<button type="button" class="btn ghost" id="cancelEditBtn2">キャンセルして新規入力に戻る</button>' : '') +
        '<div class="msg" id="msg"></div>' +
      '</form>' +
    '</div>' +

    '<div class="card">' +
      '<h2>カテゴリ別 予算消化(' + SELECTED_MONTH + ')</h2>' +
      (catRows || '<div style="font-size:13px;color:var(--muted)">表示できるカテゴリがありません</div>') +
    '</div>' +

    '<div class="card">' +
      '<h2>予算対象外のカテゴリ(' + SELECTED_MONTH + ')</h2>' +
      (otherRows || '<div style="font-size:13px;color:var(--muted)">この月はまだありません</div>') +
    '</div>' +

    '<div class="card">' +
      '<h2>入力一覧(' + SELECTED_MONTH + ')</h2>' +
      '<div class="table-scroll"><table><thead><tr><th>日付</th><th>支払者</th><th>カテゴリ</th><th>金額</th><th>方法</th><th>メモ</th><th></th></tr></thead>' +
      '<tbody>' + (recent || '<tr><td colspan="7" style="color:var(--muted)">この月の入力はまだありません</td></tr>') + '</tbody></table></div>' +
    '</div>' +

    '<div class="footer-link"><button type="button" id="logoutBtn">ログアウト</button></div>';

  document.getElementById('entryForm').addEventListener('submit', onSubmit);
  document.querySelectorAll('[data-edit]').forEach(function(btn) {
    btn.addEventListener('click', function() { startEdit(btn.dataset.edit); });
  });
  document.querySelectorAll('[data-del]').forEach(function(btn) {
    btn.addEventListener('click', function() { onDelete(btn.dataset.del); });
  });
  var cancelBtn = document.getElementById('cancelEditBtn');
  if (cancelBtn) cancelBtn.addEventListener('click', cancelEdit);
  var cancelBtn2 = document.getElementById('cancelEditBtn2');
  if (cancelBtn2) cancelBtn2.addEventListener('click', cancelEdit);
  document.getElementById('refreshBtn').addEventListener('click', refreshData);
  document.getElementById('monthSelect').addEventListener('change', function() {
    SELECTED_MONTH = this.value;
    render();
  });
  document.getElementById('logoutBtn').addEventListener('click', function() {
    if (confirm('ログアウトしますか?')) logout();
  });
}

async function refreshData() {
  var btn = document.getElementById('refreshBtn');
  if (btn) { btn.disabled = true; btn.textContent = '更新中...'; }
  try {
    var data = await getInitialData();
    STATE.config = data.config;
    STATE.log = data.log;
    render();
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = '⟳ 更新'; }
    alert(err.message || String(err));
  }
}

function startEdit(id) {
  EDITING_ID = id;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
  EDITING_ID = null;
  render();
}

async function onDelete(id) {
  if (!confirm('この記録を削除しますか?')) return;
  try {
    var result = await deleteEntry(id);
    STATE.log = result.log;
    if (EDITING_ID === id) EDITING_ID = null;
    render();
    var m = document.getElementById('msg');
    if (m) { m.className = 'msg ok'; m.textContent = '削除しました'; }
  } catch (err) {
    alert(err.message || String(err));
  }
}

async function onSubmit(ev) {
  ev.preventDefault();
  var btn = document.getElementById('submitBtn');
  var msg = document.getElementById('msg');
  msg.className = 'msg';
  msg.textContent = '';

  var entry = {
    date: document.getElementById('f_date').value,
    payer: document.getElementById('f_payer').value,
    category: document.getElementById('f_category').value,
    amount: document.getElementById('f_amount').value,
    paymentMethod: document.getElementById('f_method').value,
    memo: document.getElementById('f_memo').value
  };

  btn.disabled = true;
  btn.textContent = '送信中...';

  storageSet('lastPayer', entry.payer);
  storageSet('lastMethod', entry.paymentMethod);

  var wasEditing = !!EDITING_ID;
  try {
    var result = wasEditing ? await updateEntry(EDITING_ID, entry) : await submitEntry(entry);
    STATE.log = result.log;
    EDITING_ID = null;
    render();
    var m = document.getElementById('msg');
    if (m) { m.className = 'msg ok'; m.textContent = wasEditing ? '更新しました' : '記録しました'; }
  } catch (err) {
    btn.disabled = false;
    btn.textContent = wasEditing ? '更新' : '確定';
    msg.className = 'msg err';
    msg.textContent = err.message || String(err);
  }
}

/* ============================================================
   ダッシュボード(見るだけ)
   ------------------------------------------------------------
   PCの資産管理アプリが自動保存している「資産データ.json」を読み取り専用で
   表示する。書き込みは一切しない(PCアプリの自動保存と衝突させないため)。
   集計ルールはPCアプリの renderDashboardBody などと同じにしてある:
   振替は常に除外、計算対象を外した取引(t.excluded)も除外、純資産は
   銀行・証券の残高(その月以前で最後に記録された残高)− カードのその月の利用額
   ============================================================ */
var ASSET_FILE_NAME = '資産データ.json';
var TRANSFER_CATEGORY = '振替';
var VIEW = 'input';
var DASH = { asset: null, savedAt: null, month: null, expanded: {} };

function switchView(view) {
  VIEW = view;
  document.querySelectorAll('#tabs button').forEach(function(b) {
    b.classList.toggle('active', b.dataset.view === view);
  });
  window.scrollTo(0, 0);
  if (view === 'dash') showDashboard(false);
  else render();
}

async function fileModifiedTime(name) {
  var id = await findFileId(name);
  var res = await driveFetch('https://www.googleapis.com/drive/v3/files/' + id + '?fields=modifiedTime');
  if (!res.ok) return null;
  return (await res.json()).modifiedTime || null;
}

async function showDashboard(forceReload) {
  if (!DASH.asset || forceReload) {
    document.getElementById('app').innerHTML = '<div class="loading">資産データを読み込み中...</div>';
    try {
      var results = await Promise.all([readJson(ASSET_FILE_NAME), fileModifiedTime(ASSET_FILE_NAME)]);
      DASH.asset = results[0];
      DASH.savedAt = results[1];
    } catch (err) {
      if (VIEW !== 'dash') return;
      document.getElementById('app').innerHTML =
        '<div class="card login-box"><p>' + escapeHtml(err.message || String(err)) +
        '<br>(ダッシュボードは「資産データ.json」を共有されたアカウントだけが見られます)</p>' +
        '<button type="button" class="btn" id="dashRetryBtn">再読み込み</button></div>';
      document.getElementById('dashRetryBtn').addEventListener('click', function() { showDashboard(true); });
      return;
    }
  }
  if (VIEW === 'dash') renderDashboard();
}

function assetMonths(a) {
  return Object.keys(a.monthlySnapshots || {}).sort();
}

function balanceAt(a, accountId, month) {
  var months = assetMonths(a).filter(function(m) { return m <= month; });
  for (var i = months.length - 1; i >= 0; i--) {
    var bal = (a.monthlySnapshots[months[i]].accountBalances || {})[accountId];
    if (bal !== undefined) return bal;
  }
  return 0;
}

function cardCycleTotal(a, accountId, month) {
  var snap = a.monthlySnapshots[month];
  if (!snap) return 0;
  return snap.transactions
    .filter(function(t) { return t.accountId === accountId; })
    .reduce(function(s, t) { return s + Math.abs(t.amount); }, 0);
}

function netWorthForMonth(a, month) {
  var assets = 0, investments = 0, liabilities = 0;
  (a.accounts || []).forEach(function(acc) {
    if (acc.type === 'bank') assets += balanceAt(a, acc.id, month);
    else if (acc.type === 'investment') investments += balanceAt(a, acc.id, month);
    else if (acc.type === 'card') liabilities += cardCycleTotal(a, acc.id, month);
  });
  (a.purposeAccounts || []).forEach(function(pa) { assets += purposeBalanceAtMonthEnd(a, pa, month); });
  return { liabilities: liabilities, total: assets + investments - liabilities };
}

// 目的別口座(PC版と同じ計算): 基準残高 + 代表口座のCSVに出る「普通 円 (口座名)」の入出金
// + 手で記録した目的別口座どうしの移動。基準日より後は足し、前は差し引く
function normDesc(s) {
  return String(s || '').normalize('NFKC').replace(/\s+/g, ' ').trim();
}
function purposeFlows(a, pa) {
  var key = normDesc('普通 円 ' + pa.name);
  var out = [];
  Object.keys(a.monthlySnapshots || {}).forEach(function(m) {
    (a.monthlySnapshots[m].transactions || []).forEach(function(t) {
      if (t.accountId === pa.parentAccountId && normDesc(t.desc) === key) out.push({ date: t.date, amount: -t.amount });
    });
  });
  (pa.adjustments || []).forEach(function(x) { out.push({ date: x.date, amount: x.amount }); });
  return out;
}
function purposeBalanceAtMonthEnd(a, pa, month, flows) {
  var end = month + '-31';
  var bal = pa.baseBalance;
  (flows || purposeFlows(a, pa)).forEach(function(f) {
    if (f.date > pa.baseDate && f.date <= end) bal += f.amount;
    else if (f.date > end && f.date <= pa.baseDate) bal -= f.amount;
  });
  return bal;
}
function purposeDashHtml(a, month) {
  var tBal = 0;
  var rows = (a.purposeAccounts || []).map(function(pa) {
    var flows = purposeFlows(a, pa);
    var bal = purposeBalanceAtMonthEnd(a, pa, month, flows);
    var inSum = 0, outSum = 0;
    flows.forEach(function(f) {
      if (f.date.slice(0, 7) !== month) return;
      if (f.amount > 0) inSum += f.amount; else outSum -= f.amount;
    });
    tBal += bal;
    var sub = [inSum ? '入金 ' + fmtYen(inSum) : '', outSum ? '出金 ' + fmtYen(outSum) : ''].filter(Boolean).join(' / ');
    return '<div class="dash-row" style="cursor:default;"><div class="top"><span class="name">' + escapeHtml(pa.name) + '</span><span class="amt">' + fmtYen(bal) + '</span></div>' +
      (sub ? '<div class="sub" style="text-align:left;">' + sub + '</div>' : '') + '</div>';
  }).join('');
  return rows + '<div style="text-align:right; font-size:13px; font-weight:700; padding-top:8px;">合計 ' + fmtYen(tBal) + '</div>';
}

function leafToParent(a, leaf) {
  for (var i = 0; i < a.categories.length; i++) {
    var cat = a.categories[i];
    if (cat.name === leaf) return cat.name;
    if (cat.children && cat.children.some(function(c) { return c.name === leaf; })) return cat.name;
  }
  return leaf;
}

function parentBudget(cat) {
  if (cat.children && cat.children.length) {
    return cat.children.reduce(function(s, c) { return s + (c.budget || 0); }, 0);
  }
  return cat.budget || 0;
}

// 引落とし予定日が指定されて取り込まれた取引だけを数える(PCアプリと同じく推測はしない)
function cardDueForMonth(a, account, month) {
  var list = [];
  assetMonths(a).forEach(function(m) {
    a.monthlySnapshots[m].transactions.forEach(function(t) {
      if (t.accountId === account.id && t.debitDate && t.debitDate.slice(0, 7) === month) list.push(t);
    });
  });
  return {
    amount: list.reduce(function(s, t) { return s + Math.abs(t.amount); }, 0),
    count: list.length,
    debitDates: Array.from(new Set(list.map(function(t) { return t.debitDate; }))).sort(),
    usageMonths: Array.from(new Set(list.map(function(t) { return t.date.slice(0, 7); }))).sort()
  };
}

function dashTotals(a, month) {
  var catTotals = {}, leafTotals = {}, incomeTotals = {}, totalIncome = 0;
  var snap = a.monthlySnapshots[month];
  (snap ? snap.transactions : []).forEach(function(t) {
    if (t.category === TRANSFER_CATEGORY) return;
    if (t.excluded) return;
    if (t.amount < 0) {
      var leaf = t.category || 'その他';
      var parent = t.category ? leafToParent(a, t.category) : 'その他';
      catTotals[parent] = (catTotals[parent] || 0) + Math.abs(t.amount);
      leafTotals[leaf] = (leafTotals[leaf] || 0) + Math.abs(t.amount);
    } else if (t.amount > 0) {
      var inc = t.category || '未分類';
      incomeTotals[inc] = (incomeTotals[inc] || 0) + t.amount;
      totalIncome += t.amount;
    }
  });
  var totalSpend = Object.keys(catTotals).reduce(function(s, k) { return s + catTotals[k]; }, 0);
  return { catTotals: catTotals, leafTotals: leafTotals, incomeTotals: incomeTotals, totalIncome: totalIncome, totalSpend: totalSpend };
}

// 予算バーをタップしたときの明細(PCアプリと同じく、振替・計算対象外もそのまま表示する)
function dashTransactionsFor(a, month, key) {
  var snap = a.monthlySnapshots[month];
  if (!snap) return [];
  var isIncome = key.indexOf('income:') === 0;
  var name = key.slice(key.indexOf(':') + 1);
  return snap.transactions.filter(function(t) {
    if (isIncome) return t.amount > 0 && (t.category || '未分類') === name;
    return t.amount < 0 && (t.category || 'その他') === name;
  }).sort(function(x, y) { return x.date < y.date ? 1 : (x.date > y.date ? -1 : 0); });
}

function dashDetailHtml(a, month, key) {
  var txns = dashTransactionsFor(a, month, key);
  if (txns.length === 0) return '<div class="dash-detail"><div class="empty-note">この月の取引はありません</div></div>';
  var rows = txns.map(function(t) {
    return '<tr><td style="white-space:nowrap;">' + escapeHtml(t.date.slice(5).replace('-', '/')) + '</td><td>' + escapeHtml(t.desc) +
      (t.logMemo ? '<div class="memo">📝 ' + escapeHtml(t.logMemo) + '</div>' : '') +
      (t.excluded ? '<div class="memo">(計算対象外)</div>' : '') +
      '</td><td style="white-space:nowrap; text-align:right;">' + fmtYen(Math.abs(t.amount)) + '</td></tr>';
  }).join('');
  return '<div class="dash-detail"><table><tbody>' + rows + '</tbody></table></div>';
}

function dashBudgetRow(label, used, budget, opts) {
  var hasBudget = budget > 0;
  var pct = hasBudget ? Math.min(100, Math.round((used / budget) * 100)) : (used > 0 ? 100 : 0);
  var barClass = !hasBudget ? 'none' : (used > budget ? 'bad' : '');
  var rem = budget - used;
  var sub = hasBudget
    ? 'のこり <span style="font-weight:700; color:' + (rem < 0 ? 'var(--bad)' : 'var(--good)') + ';">' + fmtYen(rem) + '</span>'
    : (used > 0 ? '予算未設定' : '');
  return '<div class="dash-row' + (opts.child ? ' child' : '') + '"' + (opts.attrs || '') + '>' +
    '<div class="top"><span class="name">' + escapeHtml(label) + (opts.caret ? '<span class="caret">' + opts.caret + '</span>' : '') + '</span>' +
    '<span class="amt">' + (hasBudget ? fmtYen(used) + ' / ' + fmtYen(budget) : fmtYen(used)) + '</span></div>' +
    '<div class="bar-outer"><div class="bar-inner ' + barClass + '" style="width:' + pct + '%"></div></div>' +
    (sub ? '<div class="sub">' + sub + '</div>' : '') +
    '</div>';
}

function netWorthChartSvg(a, months) {
  if (months.length === 0) return '';
  var w = 360, h = 170, padL = 44, padR = 12, padT = 14, padB = 24;
  var pts = months.map(function(m) { return { m: m, v: netWorthForMonth(a, m).total }; });
  var maxV = Math.max.apply(null, pts.map(function(p) { return p.v; }).concat([0]));
  var minV = Math.min.apply(null, pts.map(function(p) { return p.v; }).concat([0]));
  if (maxV === minV) maxV += 1;
  var xStep = pts.length > 1 ? (w - padL - padR) / (pts.length - 1) : 0;
  function x(i) { return padL + i * xStep; }
  function y(v) { return padT + (h - padT - padB) * (1 - (v - minV) / (maxV - minV)); }
  function short(n) { n = Math.round(n); return Math.abs(n) >= 10000 ? (n / 10000).toFixed(0) + '万' : String(n); }
  var path = pts.map(function(p, i) { return (i ? 'L' : 'M') + x(i) + ',' + y(p.v); }).join(' ');
  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%; height:auto; display:block;">' +
    '<line x1="' + padL + '" y1="' + y(0) + '" x2="' + (w - padR) + '" y2="' + y(0) + '" stroke="#DFE2EA" stroke-width="1"/>' +
    '<path d="' + path + '" fill="none" stroke="#3457D5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  var labelEvery = Math.ceil(pts.length / 6);
  pts.forEach(function(p, i) {
    svg += '<circle cx="' + x(i) + '" cy="' + y(p.v) + '" r="3" fill="#3457D5"/>';
    if (i % labelEvery === 0 || i === pts.length - 1) {
      svg += '<text x="' + x(i) + '" y="' + (h - 6) + '" font-size="10" fill="#8A90A3" text-anchor="middle">' + p.m.slice(2).replace('-', '/') + '</text>';
    }
  });
  svg += '<text x="2" y="' + (y(maxV) + 4) + '" font-size="10" fill="#8A90A3">' + short(maxV) + '</text>' +
    '<text x="2" y="' + (y(minV) + 4) + '" font-size="10" fill="#8A90A3">' + short(minV) + '</text></svg>';
  return svg;
}

function formatSavedAt(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function renderDashboard() {
  var a = DASH.asset;
  var months = assetMonths(a);
  if (months.length === 0) {
    document.getElementById('app').innerHTML = '<div class="card"><div class="empty-note">資産データにまだ取引がありません</div></div>';
    return;
  }
  if (!DASH.month || months.indexOf(DASH.month) === -1) {
    var cur = localMonthKey(new Date());
    DASH.month = months.indexOf(cur) !== -1 ? cur : months[months.length - 1];
  }
  var month = DASH.month;
  var nw = netWorthForMonth(a, month);
  var prev = months[months.indexOf(month) - 1];
  var delta = prev ? nw.total - netWorthForMonth(a, prev).total : null;
  var t = dashTotals(a, month);

  function tile(label, value, cls) {
    return '<div class="kpi-tile"><div class="label">' + label + '</div><div class="value ' + (cls || '') + '">' + value + '</div></div>';
  }

  // 今月の予算: 支出全体 → 大項目(子があればタップで子を一括開閉)→ 小項目(タップで明細)
  var totalBudget = 0;
  a.categories.forEach(function(cat) { totalBudget += parentBudget(cat); });
  var budgetHtml = dashBudgetRow('支出全体', t.totalSpend, totalBudget, { attrs: ' style="cursor:default;"' });
  a.categories.forEach(function(cat) {
    var hasChildren = cat.children && cat.children.length > 0;
    if (hasChildren) {
      var keys = cat.children.map(function(c) { return 'leaf:' + c.name; });
      var allOpen = keys.every(function(k) { return DASH.expanded[k]; });
      budgetHtml += dashBudgetRow(cat.name, t.catTotals[cat.name] || 0, parentBudget(cat), {
        caret: allOpen ? '▲' : '▼',
        attrs: ' data-parent-keys="' + escapeHtml(keys.join('|')) + '" data-all-open="' + allOpen + '"'
      });
      cat.children.forEach(function(child) {
        var key = 'leaf:' + child.name;
        budgetHtml += dashBudgetRow(child.name, t.leafTotals[child.name] || 0, child.budget || 0, {
          child: true, caret: DASH.expanded[key] ? '▲' : '▼', attrs: ' data-key="' + escapeHtml(key) + '"'
        });
        if (DASH.expanded[key]) budgetHtml += dashDetailHtml(a, month, key);
      });
    } else {
      var k = 'leaf:' + cat.name;
      budgetHtml += dashBudgetRow(cat.name, t.catTotals[cat.name] || 0, parentBudget(cat), {
        caret: DASH.expanded[k] ? '▲' : '▼', attrs: ' data-key="' + escapeHtml(k) + '"'
      });
      if (DASH.expanded[k]) budgetHtml += dashDetailHtml(a, month, k);
    }
  });

  var incomeCats = Object.keys(t.incomeTotals).sort(function(x, y) { return t.incomeTotals[y] - t.incomeTotals[x]; });
  var incomeHtml = incomeCats.length === 0 ? '<div class="empty-note">この月の入金はありません</div>' :
    incomeCats.map(function(c) {
      var key = 'income:' + c;
      var pct = Math.min(100, Math.round((t.incomeTotals[c] / t.totalIncome) * 100));
      return '<div class="dash-row" data-key="' + escapeHtml(key) + '">' +
        '<div class="top"><span class="name">' + escapeHtml(c) + '<span class="caret">' + (DASH.expanded[key] ? '▲' : '▼') + '</span></span><span class="amt">' + fmtYen(t.incomeTotals[c]) + '</span></div>' +
        '<div class="bar-outer"><div class="bar-inner" style="width:' + pct + '%"></div></div></div>' +
        (DASH.expanded[key] ? dashDetailHtml(a, month, key) : '');
    }).join('') +
    '<div style="text-align:right; font-size:13px; font-weight:700; padding-top:8px;">合計 ' + fmtYen(t.totalIncome) + '</div>';

  var cards = (a.accounts || []).filter(function(acc) { return acc.type === 'card'; });
  var cardHtml = cards.length === 0 ? '<div class="empty-note">カード口座が登録されていません</div>' :
    cards.map(function(acc) {
      var due = cardDueForMonth(a, acc, month);
      if (!due.count) {
        return '<div class="dash-row" style="cursor:default;"><div class="top"><span class="name">' + escapeHtml(acc.name) + '</span><span class="amt">—</span></div>' +
          '<div class="sub" style="text-align:left;">この月に引落とし予定日を指定した取込がありません</div></div>';
      }
      return '<div class="dash-row" style="cursor:default;"><div class="top"><span class="name">' + escapeHtml(acc.name) + '</span><span class="amt" style="color:var(--navy); font-weight:700;">' + fmtYen(due.amount) + '</span></div>' +
        '<div class="sub" style="text-align:left;">引落とし日 ' + escapeHtml(due.debitDates.join('・')) + ' / 利用月 ' + escapeHtml(due.usageMonths.join('・')) + ' / ' + due.count + '件</div></div>';
    }).join('');

  var monthOptions = months.slice().reverse().map(function(m) { return optionHtml(m, m === month); }).join('');

  document.getElementById('app').innerHTML =
    '<div class="card">' +
      '<div class="card-head"><h2>ダッシュボード(見るだけ)</h2>' +
        '<div style="display:flex; gap:6px; align-items:center;">' +
          '<select id="dashMonthSelect" style="width:auto; padding:5px 8px; font-size:14px;">' + monthOptions + '</select>' +
          '<button type="button" id="dashRefreshBtn">⟳ 更新</button>' +
        '</div>' +
      '</div>' +
      '<div class="kpi-grid">' +
        tile('純資産合計', fmtYen(nw.total)) +
        tile('前月比', delta === null ? '—' : (delta >= 0 ? '+' : '') + fmtYen(delta), delta === null ? '' : (delta >= 0 ? 'good' : 'bad')) +
        tile('今月の支出合計', fmtYen(t.totalSpend)) +
        tile('今月の収入合計', fmtYen(t.totalIncome)) +
        tile('カード残高(負債)', fmtYen(nw.liabilities), nw.liabilities > 0 ? 'bad' : '') +
      '</div>' +
      '<div class="saved-at">PCの資産管理アプリで最後に保存: ' + escapeHtml(formatSavedAt(DASH.savedAt) || '不明') + '(CSV取込・分類はPCで行います)</div>' +
    '</div>' +
    '<div class="card"><h2>純資産の推移</h2>' + netWorthChartSvg(a, months) + '</div>' +
    ((a.purposeAccounts || []).length ? '<div class="card"><h2>目的別口座(' + month + '末)</h2>' + purposeDashHtml(a, month) + '</div>' : '') +
    '<div class="card"><h2>予算(' + month + ')</h2>' + budgetHtml + '</div>' +
    '<div class="card"><h2>収入(' + month + ')</h2>' + incomeHtml + '</div>' +
    '<div class="card"><h2>クレジットカード引落とし予定(' + month + ')</h2>' + cardHtml + '</div>';

  document.getElementById('dashMonthSelect').addEventListener('change', function() {
    DASH.month = this.value;
    renderDashboard();
  });
  document.getElementById('dashRefreshBtn').addEventListener('click', function() { showDashboard(true); });
  document.querySelectorAll('#app [data-key]').forEach(function(row) {
    row.addEventListener('click', function() {
      var key = row.dataset.key;
      if (DASH.expanded[key]) delete DASH.expanded[key]; else DASH.expanded[key] = true;
      renderDashboard();
    });
  });
  document.querySelectorAll('#app [data-parent-keys]').forEach(function(row) {
    row.addEventListener('click', function() {
      var open = row.dataset.allOpen === 'true';
      row.dataset.parentKeys.split('|').forEach(function(k) {
        if (open) delete DASH.expanded[k]; else DASH.expanded[k] = true;
      });
      renderDashboard();
    });
  });
}

document.querySelectorAll('#tabs button').forEach(function(b) {
  b.addEventListener('click', function() { switchView(b.dataset.view); });
});

/* ---------- 起動 ---------- */
async function boot() {
  if (CLIENT_ID.indexOf('YOUR_CLIENT_ID') === 0) {
    document.getElementById('app').innerHTML = '<div class="card login-box"><p>ログイン設定(クライアントID)がまだ入っていません。</p></div>';
    return;
  }
  var fromUrl = takeTokenFromUrl();
  if (fromUrl && fromUrl.error) {
    showLogin(fromUrl.error === 'access_denied'
      ? 'ログインがキャンセルされました。'
      : 'ログインに失敗しました(' + fromUrl.error + ')。');
    return;
  }
  if (!getValidToken()) {
    // 一度ログインしたことがある端末では、ボタンを押さずに自動でログインし直す
    if (storageGet(SIGNED_IN_KEY)) {
      startLogin();
    } else {
      showLogin('');
    }
    return;
  }
  try {
    var data = await getInitialData();
    STATE.config = data.config;
    STATE.log = data.log;
    document.getElementById('tabs').hidden = false;
    render();
    rememberLoginHint();
  } catch (err) {
    document.getElementById('app').innerHTML =
      '<div class="card login-box"><p>' + escapeHtml(err.message || String(err)) + '</p>' +
      '<button type="button" class="btn" id="retryBtn">再読み込み</button>' +
      '<div class="footer-link"><button type="button" id="logoutBtn">ログアウト</button></div></div>';
    document.getElementById('retryBtn').addEventListener('click', function() { location.reload(); });
    document.getElementById('logoutBtn').addEventListener('click', logout);
  }
}

boot();
</script>
